framework:
    messenger:
        # Отключаем дефолтную шину и объявляем свои собственные
        default_bus: command.bus
        buses:
            # Шина для Команд (изменение состояния)
            command.bus:
                middleware:
                    # Встроенное middleware от Doctrine: автоматически оборачивает выполнение 
                    # обработчика в транзакцию базы данных (уровня БД)
                    - doctrine_transaction
            
            # Шина для Запросов (чтение данных)
            query.bus:
                middleware: [] # Для запросов транзакции не нужны (экономим ресурсы)

            # Новая шина для Доменных Событий
            event.bus:
                default_middleware:
                    # Позволяет событиям выполняться, даже если на них никто не подписан
                    allow_no_handlers: true    

        # Маршрутизация сообщений (в будущем сюда можно подключить RabbitMQ/Kafka)
        transports:
            # Пока оставляем синхронную обработку в памяти (sync)
            sync: 'sync://'

        routing:
            # Все наши команды и запросы по умолчанию будут обрабатываться синхронно
            'Billing\Application\Command\*': sync
            'Billing\Application\Query\*': sync
