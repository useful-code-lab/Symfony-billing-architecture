framework:
    messenger:
        # Отключаем дефолтную шину и объявляем свои собственные
        default_bus: command.bus
        buses:
            # Шина для Команд (изменение состояния)
            command.bus:
                middleware:
                    # Наш кастомный валидатор проверяет DTO на входе
                    - 'App\Billing\Infrastructure\Share\ValidationMiddleware'                   
                    # Встроенное middleware от Doctrine: автоматически оборачивает выполнение 
                    # обработчика в транзакцию базы данных (уровня БД)
                    - doctrine_transaction
            
            # Шина для Запросов (чтение данных)
            query.bus:
                middleware: [] # Для запросов транзакции не нужны (экономим ресурсы)

            # Новая шина для Доменных Событий
            event.bus:
                default_middleware:
                    # Позволяет событиям выполняться, даже если на них никто не подписан
                    allow_no_handlers: true    

        # Настройка транспортов хранения и передачи сообщений
        transports:
            # Синхронный транспорт (оставляем для команд и запросов)
            sync: 'sync://'
            
            # Наш новый АСИНХРОННЫЙ транспорт, работающий через PostgreSQL
            async: 
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3       # В случае сбоя воркер попытается обработать событие 3 раза
                    delay: 1000          # Пауза между попытками (1 секунда)
                    multiplier: 2        # Каждая следующая попытка удваивает время ожидания (1с -> 2с -> 4с)

        # Маршрутизация: жестко определяем, какие классы обрабатываются синхронно, а какие — в фоне
        routing:
            # Команды и запросы выполняются моментально в рамках HTTP-запроса
            'App\Billing\Application\Command\*': sync
            'App\Billing\Application\Query\*': sync
            
            # ВАЖНО: Доменное событие пополнения баланса мы отправляем в асинхронную очередь PostgreSQL!
            'App\Billing\Domain\Model\AccountDepositedEvent': async
